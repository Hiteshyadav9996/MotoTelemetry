name: dominar_telemetry
description: Dominar 400 motorcycle telemetry dashboard with Google Maps split view.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  flutter_svg: ^2.2.0
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/throttle_icon.svg
