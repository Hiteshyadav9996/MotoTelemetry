; USB Ethernet gadget (TinyUSB NCM). Compile does not need the ESP32 plugged in.
; Flash (-t upload) and the iPhone Ethernet test do. After the first NCM flash,
; hold BOOT while plugging in. See docs/esp32_s3_usb_ncm_iphone.md.
[ncm]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
extra_scripts = pre:ncm_embed_stub.py
platform_packages =
  tool-esptoolpy@https://github.com/pioarduino/esptool/releases/download/v5.0.0-dev1/esptool.zip
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:d400-ncm-bench]
extends = ncm
board_build.cmake_extra_args = -DD400_NCM_TARGET=bench
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D D400_USB_NCM=1
  -D D400_ENABLE_SOFTAP=0

[env:d400-ride-usb-ncm]
extends = ncm
board_build.cmake_extra_args = -DD400_NCM_TARGET=ride
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -Os
  -D D400_RIDE_BINARY_ONLY=1
  -D D400_USB_NCM=1
  -D D400_ENABLE_SOFTAP=0
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=0
