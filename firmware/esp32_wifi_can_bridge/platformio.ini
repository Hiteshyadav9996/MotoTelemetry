[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
build_src_filter =
  +<*>
  -<main_passive_only.cpp>
  -<main_obd_pid_only.cpp>
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:d400-ride-minimal]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter =
  +<*>
  -<main.cpp>
  -<main_passive_only.cpp>
  -<main_obd_pid_only.cpp>
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -Os
  -D D400_RIDE_BINARY_ONLY=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

